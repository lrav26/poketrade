{% extends 'base.html' %}


{% block content %}
<div class="container mt-4">
    <h1>Confirm Purchase</h1>
    <p>Are you sure you want to buy <strong>{{ listing.pokemon.name }}</strong> for <strong>${{ listing.price }}</strong>?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-success">Confirm Purchase</button>
        <a href="{% url 'marketplace_home' %}" class="btn btn-secondary ms-2">Cancel</a>
    </form>

    {% if purchased %}
        <div class="alert alert-success mt-4">
            Congratulations! You bought {{ listing.pokemon.name }} successfully!
        </div>

        <script>
            window.purchaseHappened = true;
        </script>

    {% endif %}

</div>
{% endblock %}
